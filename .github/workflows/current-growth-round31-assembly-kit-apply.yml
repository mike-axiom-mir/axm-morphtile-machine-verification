name: current growth round 31 assembly kit apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-growth-round31-assembly-kit-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 9fe8b53daf3e572c596c142859cca2199a976553
          path: assembly-base
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 968e7351787f8bf8ffb7c327a937aa5d8978bcc1
          path: assembly-pr39
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact Assembly receiver-application candidate
        working-directory: verification
        run: |
          set -o pipefail
          node --test test/current-growth-round31-assembly-kit-apply.test.js 2>&1 | tee round31-assembly-kit-apply.log
        env:
          R31_ASSEMBLY_BASE_ROOT: ${{ github.workspace }}/assembly-base
          R31_ASSEMBLY_BASE_COMMIT: 9fe8b53daf3e572c596c142859cca2199a976553
          R31_ASSEMBLY39_ROOT: ${{ github.workspace }}/assembly-pr39
          R31_ASSEMBLY39_COMMIT: 968e7351787f8bf8ffb7c327a937aa5d8978bcc1
          R31_MORPHTILE_ROOT: ${{ github.workspace }}/morphtile
          R31_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
      - name: Preserve round 31 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-growth-round31-assembly-kit-apply-log
          path: verification/round31-assembly-kit-apply.log
          if-no-files-found: error
