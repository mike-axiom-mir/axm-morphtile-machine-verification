name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 4346df01ed18cd1336064f9323d7766ff4f6338a
          path: .runtime/morphtile-hash
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 13d83a2b2c0d12644442d3d9e45bcbe0af19876a
          path: .runtime/morphtile-kit
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 0ae941c3ebc2293bbe974a309bdd27a97b4f3fd0
          path: .runtime/assembly
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: 6446f355f4aeea676269524d410ea42e17324737
          path: .runtime/capability
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 23a91130ed07efc12573aa5c79f37540ef3ac921
          path: .runtime/morphtile-flow
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 35e4c9f464f13d6778f1f82d340e5cd63c86ee7a
          path: .runtime/surface
          sparse-checkout: |
            src
            machine.json
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: 48915b6602142d263629ca5db87052f82fdf9a0c
          path: .runtime/capability-current
          sparse-checkout: |
            src
            machine.json
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: 795ac57694d69128d4a077de4ee1750f98ea277b
          path: .runtime/capability-wakes
          sparse-checkout: |
            src
            machine.json
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: b6b086edb70fd4657495fcf01cb9fcdedceafdaf
          path: .runtime/morphtile-current
          sparse-checkout: |
            core
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Target Surface re-verification
        run: node --test test/surface-intent-conformance.test.js
        env:
          SURFACE_REPO_PATH: ${{ github.workspace }}/.runtime/surface
          SURFACE_COMMIT: 35e4c9f464f13d6778f1f82d340e5cd63c86ee7a
      - name: Target Capability wake re-verification
        run: node --test test/capability-wake-conformance.test.js
        env:
          CAPABILITY_WAKE_REPO_PATH: ${{ github.workspace }}/.runtime/capability-wakes
          CAPABILITY_WAKE_COMMIT: 795ac57694d69128d4a077de4ee1750f98ea277b
          MORPHTILE_CURRENT_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile-current/core/morphtile.js
          MORPHTILE_CURRENT_COMMIT: b6b086edb70fd4657495fcf01cb9fcdedceafdaf
      - name: Full Verification suite
        run: npm test
        env:
          MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile-hash/core/morphtile.js
          MORPHTILE_COMMIT: 4346df01ed18cd1336064f9323d7766ff4f6338a
          KIT_MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile-kit/core/morphtile.js
          KIT_MORPHTILE_COMMIT: 13d83a2b2c0d12644442d3d9e45bcbe0af19876a
          ASSEMBLY_REPO_PATH: ${{ github.workspace }}/.runtime/assembly
          ASSEMBLY_COMMIT: 0ae941c3ebc2293bbe974a309bdd27a97b4f3fd0
          CAPABILITY_REPO_PATH: ${{ github.workspace }}/.runtime/capability
          CAPABILITY_COMMIT: 6446f355f4aeea676269524d410ea42e17324737
          CAPABILITY_MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile-hash/core/morphtile.js
          CAPABILITY_MORPHTILE_COMMIT: 4346df01ed18cd1336064f9323d7766ff4f6338a
          FLOW_MORPHTILE_REPO_PATH: ${{ github.workspace }}/.runtime/morphtile-flow
          FLOW_MORPHTILE_COMMIT: 23a91130ed07efc12573aa5c79f37540ef3ac921
          SURFACE_REPO_PATH: ${{ github.workspace }}/.runtime/surface
          SURFACE_COMMIT: 35e4c9f464f13d6778f1f82d340e5cd63c86ee7a
          CAPABILITY_CURRENT_REPO_PATH: ${{ github.workspace }}/.runtime/capability-current
          CAPABILITY_CURRENT_COMMIT: 48915b6602142d263629ca5db87052f82fdf9a0c
          CAPABILITY_WAKE_REPO_PATH: ${{ github.workspace }}/.runtime/capability-wakes
          CAPABILITY_WAKE_COMMIT: 795ac57694d69128d4a077de4ee1750f98ea277b
          MORPHTILE_CURRENT_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile-current/core/morphtile.js
          MORPHTILE_CURRENT_COMMIT: b6b086edb70fd4657495fcf01cb9fcdedceafdaf
