name: current growth round 22

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-growth-round22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: core
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 58a9c272257fed179b0136671c2fcfb42ac7dfe2
          path: form-base
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 57af06dd66b311dad1a3d2d1f380815b312d32c9
          path: form-pr35
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current round 22 Form boundary
        working-directory: verification
        run: |
          set -o pipefail
          node --test test/current-growth-round22.test.js 2>&1 | tee round22.log
        env:
          R22_CORE_PATH: ${{ github.workspace }}/core/core/morphtile.js
          R22_CORE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          R22_FORM_BASE_ROOT: ${{ github.workspace }}/form-base
          R22_FORM_BASE_COMMIT: 58a9c272257fed179b0136671c2fcfb42ac7dfe2
          R22_FORM35_ROOT: ${{ github.workspace }}/form-pr35
          R22_FORM35_COMMIT: 57af06dd66b311dad1a3d2d1f380815b312d32c9
      - name: Preserve round 22 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-growth-round22-log
          path: verification/round22.log
          if-no-files-found: error
