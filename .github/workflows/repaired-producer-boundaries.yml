name: Repaired producer boundary conformance

on:
  pull_request:
  push:
    branches:
      - verification/recheck-repaired-producers-20260920

permissions:
  contents: read

jobs:
  repaired-producer-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: ef2b3c6986aa1a333247feffc43a8443f17239d0
          path: .runtime/morphtile

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 941779901406961190e27a6abac9307ab00b89ae
          path: .runtime/surface

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 18302ba9d3a305b127867dff4b1ff10c68db400d
          path: .runtime/form

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recheck repaired Surface and Form boundaries
        run: node --test test/repaired-producer-boundaries.test.js
        env:
          MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          MORPHTILE_COMMIT: ef2b3c6986aa1a333247feffc43a8443f17239d0
          SURFACE_REPO_PATH: ${{ github.workspace }}/.runtime/surface
          SURFACE_COMMIT: 941779901406961190e27a6abac9307ab00b89ae
          FORM_REPO_PATH: ${{ github.workspace }}/.runtime/form
          FORM_COMMIT: 18302ba9d3a305b127867dff4b1ff10c68db400d

      - name: Run owned Verification suite
        run: npm test
