name: round 59 Assembly57 Core19 fleet

on:
  pull_request:
    branches:
      - main
    paths:
      - "test/round59-assembly57-core19-fleet-refresh.test.js"
      - ".github/workflows/round59-assembly57-core19-fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assembly57:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 0190b870ef6a1d8430deb032b0389438f2801d01
          fetch-depth: 0
          path: assembly57
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: ef6a09e4d662d960e015f61d7991c58d33f5c6d1
          path: form-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          path: surface-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          path: capability-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 25dcb936e09bd440816d158b55151c879d5a558d
          path: interface-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 685df074701feeae3e9d789e532d0a3658030bf4
          fetch-depth: 0
          path: morphtile-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently verify Assembly57 fleet provenance
        env:
          R59_ASSEMBLY57_ROOT: ${{ github.workspace }}/assembly57
          R59_ASSEMBLY_BASE_COMMIT: 690f15a65398bf34b8f1ddd2d6a8eca5f40aecfe
          R59_ASSEMBLY57_COMMIT: 0190b870ef6a1d8430deb032b0389438f2801d01
          R59_FORM_MAIN_ROOT: ${{ github.workspace }}/form-main
          R59_SURFACE_MAIN_ROOT: ${{ github.workspace }}/surface-main
          R59_CAPABILITY_MAIN_ROOT: ${{ github.workspace }}/capability-main
          R59_INTERFACE_MAIN_ROOT: ${{ github.workspace }}/interface-main
          R59_MORPHTILE_ROOT: ${{ github.workspace }}/morphtile-main
        run: node --test verification/test/round59-assembly57-core19-fleet-refresh.test.js
      - name: Replay Assembly57 producer suite and executable fleet receipt
        working-directory: assembly57
        run: |
          npm test
          node scripts/current-fleet-pins.js
