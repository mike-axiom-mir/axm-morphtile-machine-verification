name: current growth round 10

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current-growth-round10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: core
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: cb0bcbb89598cc03c5a5932c5a0bb2d8fd3a2e2b
          path: form-pr22
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 99018ef540857c0bcb5fa0fb4a574159c790aac5
          path: surface-pr20
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: df5b1191aff458e0de33fdfe2c814a68da8d5426
          path: interface-pr17
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: e8098842bfa084aec0ed028704f5cb65371965a8
          path: assembly-pr24
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify current round 10 boundaries
        working-directory: verification
        run: set -o pipefail; node --test test/current-growth-round10.test.js 2>&1 | tee round10.log
        env:
          R10_CORE_PATH: ${{ github.workspace }}/core/core/morphtile.js
          R10_CORE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          R10_FORM_ROOT: ${{ github.workspace }}/form-pr22
          R10_FORM_COMMIT: cb0bcbb89598cc03c5a5932c5a0bb2d8fd3a2e2b
          R10_SURFACE_ROOT: ${{ github.workspace }}/surface-pr20
          R10_SURFACE_COMMIT: 99018ef540857c0bcb5fa0fb4a574159c790aac5
          R10_INTERFACE_ROOT: ${{ github.workspace }}/interface-pr17
          R10_INTERFACE_COMMIT: df5b1191aff458e0de33fdfe2c814a68da8d5426
          R10_ASSEMBLY_ROOT: ${{ github.workspace }}/assembly-pr24
          R10_ASSEMBLY_COMMIT: e8098842bfa084aec0ed028704f5cb65371965a8
      - name: Preserve round 10 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-growth-round10-log
          path: verification/round10.log
          if-no-files-found: error
