name: current growth round 24

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current-growth-round24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 3a4af4417de21fff862bf309e3576c362bcac7f5
          path: assembly-base
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: fd0936dbf6372d918e8737221811a24c715e224b
          path: assembly-pr36
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 96dfea316216922dffca872ec083a549e4777c96
          path: interface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Assembly current Interface presentation boundary
        working-directory: verification
        run: |
          set -o pipefail
          node --test test/current-growth-round24.test.js 2>&1 | tee round24.log
        env:
          R24_ASSEMBLY_BASE_ROOT: ${{ github.workspace }}/assembly-base
          R24_ASSEMBLY_BASE_COMMIT: 3a4af4417de21fff862bf309e3576c362bcac7f5
          R24_ASSEMBLY36_ROOT: ${{ github.workspace }}/assembly-pr36
          R24_ASSEMBLY36_COMMIT: fd0936dbf6372d918e8737221811a24c715e224b
          R24_INTERFACE_ROOT: ${{ github.workspace }}/interface
          R24_INTERFACE_COMMIT: 96dfea316216922dffca872ec083a549e4777c96
      - name: Preserve round 24 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-growth-round24-log
          path: verification/round24.log
          if-no-files-found: error
