name: current-growth-round42-assembly45-form-size-closure

on:
  push:
    branches:
      - verification/round42-assembly45-form-size-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assembly45:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Verification
        uses: actions/checkout@v4
        with:
          path: verification
      - name: Checkout Assembly integrated base
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 21d87499e162da2b583959b8344d4c8ec80be74a
          path: assembly-base
      - name: Checkout Assembly 45 exact candidate
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 9da10f502b95d2f148a5e1466473828bf292bdb9
          path: assembly45
          fetch-depth: 0
      - name: Checkout integrated Form
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: b2c2202e746baf4d9dc23ec5e328ac9c63f2b695
          path: form
      - name: Checkout integrated Surface
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          path: surface
      - name: Checkout integrated Capability
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          path: capability
      - name: Checkout integrated Interface
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: ec92507b82d855de49ba024ecfdd32aada24b186
          path: interface
      - name: Checkout pinned MorphTile core
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: morphtile
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prove evidence-only source identity and bounded changed-file set
        shell: bash
        run: |
          set -euo pipefail
          diff -qr assembly-base/src assembly45/src
          diff -q assembly-base/package.json assembly45/package.json
          diff -q assembly-base/machine.json assembly45/machine.json
          actual="$(git -C assembly45 diff --name-only 21d87499e162da2b583959b8344d4c8ec80be74a..9da10f502b95d2f148a5e1466473828bf292bdb9 | sort)"
          expected="$(printf '%s\n' '.github/workflows/current-fleet.yml' 'test/current-form-size-receiver.integration.test.js' 'test/round37-current-fleet.integration.test.js' | sort)"
          test "$actual" = "$expected"
      - name: Independent focused current-Form size receiver replay
        working-directory: assembly45
        env:
          CURRENT_FORM_MACHINE_PATH: ${{ github.workspace }}/form/src
          CURRENT_FORM_COMMIT: b2c2202e746baf4d9dc23ec5e328ac9c63f2b695
          CURRENT_MORPHTILE_CORE_PATH: ${{ github.workspace }}/morphtile/core/morphtile.js
          CURRENT_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: node --test test/current-form-size-receiver.integration.test.js
      - name: Replay full exact candidate suite against the integrated sibling fleet
        working-directory: assembly45
        env:
          CURRENT_FORM_MACHINE_PATH: ${{ github.workspace }}/form/src
          CURRENT_FORM_COMMIT: b2c2202e746baf4d9dc23ec5e328ac9c63f2b695
          CURRENT_SURFACE_MACHINE_PATH: ${{ github.workspace }}/surface/src
          CURRENT_SURFACE_COMMIT: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          CURRENT_CAPABILITY_MACHINE_PATH: ${{ github.workspace }}/capability/src
          CURRENT_CAPABILITY_COMMIT: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          CURRENT_INTERFACE_MACHINE_PATH: ${{ github.workspace }}/interface/src
          CURRENT_INTERFACE_COMMIT: ec92507b82d855de49ba024ecfdd32aada24b186
          CURRENT_MORPHTILE_CORE_PATH: ${{ github.workspace }}/morphtile/core/morphtile.js
          CURRENT_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: npm test
