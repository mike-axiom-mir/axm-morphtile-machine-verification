name: current growth round 14 assembly final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-growth-round14-assembly-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: d3c8f5e3469b3b91f9e9eb7535ffbab00ce755f0
          path: assembly-pr27-final
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Assembly PR 27 final exact head
        working-directory: verification
        run: set -o pipefail; node --test test/current-growth-round14-assembly-final.test.js 2>&1 | tee round14-assembly-final.log
        env:
          R14A_ASSEMBLY_ROOT: ${{ github.workspace }}/assembly-pr27-final
          R14A_ASSEMBLY_COMMIT: d3c8f5e3469b3b91f9e9eb7535ffbab00ce755f0
      - name: Preserve Assembly final-head log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-growth-round14-assembly-final-log
          path: verification/round14-assembly-final.log
          if-no-files-found: error
