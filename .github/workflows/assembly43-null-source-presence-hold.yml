name: assembly 43 authored-null warning source HOLD

on:
  push:
    branches:
      - verification/assembly43-null-source-presence-hold
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembly43-null-source-presence-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 21d87499e162da2b583959b8344d4c8ec80be74a
          path: assembly-base
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: 08a11e78ab6d4d8bc267b4fd70ec0a846edc51da
          path: assembly43
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reproduce authored-null warning-source ambiguity on current exact head
        working-directory: verification
        run: |
          set -o pipefail
          node --test test/assembly43-null-source-presence-regression.test.js 2>&1 | tee assembly43-null-source-presence.log
        env:
          A43_ASSEMBLY_BASE_ROOT: ${{ github.workspace }}/assembly-base
          A43_ASSEMBLY_BASE_COMMIT: 21d87499e162da2b583959b8344d4c8ec80be74a
          A43_ASSEMBLY43_ROOT: ${{ github.workspace }}/assembly43
          A43_ASSEMBLY43_COMMIT: 08a11e78ab6d4d8bc267b4fd70ec0a846edc51da
      - name: Preserve Assembly 43 HOLD log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembly43-null-source-presence-current-head-hold-log
          path: verification/assembly43-null-source-presence.log
          if-no-files-found: error
