name: Interface target proof conformance

on:
  pull_request:
  push:
    branches:
      - verification/recheck-repaired-producers-20260920

permissions:
  contents: read

jobs:
  interface-target-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: ef2b3c6986aa1a333247feffc43a8443f17239d0
          path: .runtime/morphtile

      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: b3eb923d64ebd81f58abb5ccd4052557f04f5b5a
          path: .runtime/interface

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve emitted proof obligations against canonical target matter
        run: node --test test/interface-target-proof-conformance.test.js
        env:
          INTERFACE_TARGET_PROOF_REPO_PATH: ${{ github.workspace }}/.runtime/interface
          INTERFACE_TARGET_PROOF_COMMIT: b3eb923d64ebd81f58abb5ccd4052557f04f5b5a
          INTERFACE_TARGET_PROOF_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          INTERFACE_TARGET_PROOF_CORE_COMMIT: ef2b3c6986aa1a333247feffc43a8443f17239d0
