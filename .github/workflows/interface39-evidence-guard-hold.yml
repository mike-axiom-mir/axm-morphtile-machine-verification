name: interface 39 evidence guard HOLD

on:
  push:
    branches:
      - verification/interface39-evidence-guard-hold
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface39-evidence-guard-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification
        uses: actions/checkout@v4
        with:
          path: verification
      - name: Checkout Interface 39 exact candidate
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: ef20bba019167a07be1045b2d0affad04c82daa7
          path: interface39
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reproduce evidence-guard false negatives and false positives
        working-directory: verification
        env:
          I39_ROOT: ${{ github.workspace }}/interface39
          I39_COMMIT: ef20bba019167a07be1045b2d0affad04c82daa7
        run: |
          set -o pipefail
          node --test test/interface39-evidence-guard-regression.test.js 2>&1 | tee interface39-evidence-guard-hold.log
      - name: Preserve Interface 39 HOLD log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface39-evidence-guard-hold-log
          path: verification/interface39-evidence-guard-hold.log
          if-no-files-found: error
