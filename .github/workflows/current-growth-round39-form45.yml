name: current-growth-round39-form45

on:
  push:
    branches:
      - verification/round39-form45-grid-setting-state
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-form45:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification
        uses: actions/checkout@v4
        with:
          path: verification

      - name: Checkout Form integrated predecessor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: a13e495c61e911ef1382512b4532ddf26fdcc080
          path: form-base

      - name: Checkout Form 45 refreshed exact candidate
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 6945cfb5a2fcab6f20238055fdc85ae0cbac23f9
          path: form45

      - name: Checkout pinned MorphTile core
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: morphtile

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Independent exact-head attack
        working-directory: verification
        env:
          R39_FORM_BASE_ROOT: ${{ github.workspace }}/form-base
          R39_FORM_BASE_COMMIT: a13e495c61e911ef1382512b4532ddf26fdcc080
          R39_FORM45_ROOT: ${{ github.workspace }}/form45
          R39_FORM45_COMMIT: 6945cfb5a2fcab6f20238055fdc85ae0cbac23f9
          R39_MORPHTILE_ROOT: ${{ github.workspace }}/morphtile
          R39_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: node --test test/current-growth-round39-form45-grid-setting-state.test.js

      - name: Replay Form candidate full producer suite independently
        working-directory: form45
        env:
          MORPHTILE_CORE_PATH: ${{ github.workspace }}/morphtile/core/morphtile.js
          MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: npm test
