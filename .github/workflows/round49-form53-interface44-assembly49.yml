name: round 49 Form53 Interface44 Assembly49

on:
  push:
    branches:
      - verification/round49-form53-interface44-assembly49
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/round49-form53-interface44-assembly49.yml"
      - "test/round49-form53-grid-size-state.test.js"
      - "test/round49-interface44-control-write-through.test.js"
      - "test/round49-assembly49-current-fleet-refresh.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-form53:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: dd5764efdcd75bb826dd908a4d2245ad04d0a57a
          path: form-base
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: 2484c05a9782e7eb84730a03e4a57e9f63584b55
          fetch-depth: 0
          path: form53
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Independent Form 53 exact-head attack
        working-directory: verification
        env:
          R49_FORM_BASE_ROOT: ${{ github.workspace }}/form-base
          R49_FORM_BASE_COMMIT: dd5764efdcd75bb826dd908a4d2245ad04d0a57a
          R49_FORM53_ROOT: ${{ github.workspace }}/form53
          R49_FORM53_COMMIT: 2484c05a9782e7eb84730a03e4a57e9f63584b55
          R49_MORPHTILE_ROOT: ${{ github.workspace }}/morphtile
          R49_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: node --test test/round49-form53-grid-size-state.test.js
      - name: Replay Form 53 producer suite
        working-directory: form53
        env:
          MORPHTILE_CORE_PATH: ${{ github.workspace }}/morphtile/core/morphtile.js
          MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: npm test

  verify-interface44:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: b2d2b809f1805bc029cb2b5aaa18fcc0aa6c0cf8
          fetch-depth: 0
          path: interface44
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Independent Interface 44 exact-head attack
        working-directory: verification
        env:
          R49_INTERFACE_BASE_COMMIT: ddafc9e30144d12605c6e4198cd8d6c5764e6212
          R49_INTERFACE44_ROOT: ${{ github.workspace }}/interface44
          R49_INTERFACE44_COMMIT: b2d2b809f1805bc029cb2b5aaa18fcc0aa6c0cf8
          R49_MORPHTILE_ROOT: ${{ github.workspace }}/morphtile
          R49_MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: node --test test/round49-interface44-control-write-through.test.js
      - name: Replay Interface 44 producer suite
        working-directory: interface44
        env:
          MORPHTILE_CORE: ${{ github.workspace }}/morphtile/core/morphtile.js
          MORPHTILE_COMMIT: 2bdf8eade1376055473b9cc1b11734b72a5566e5
        run: npm test

  verify-assembly49:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verification
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: d8f856e6cabb917ee8be4c84642121a023187422
          fetch-depth: 0
          path: assembly49
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: dd5764efdcd75bb826dd908a4d2245ad04d0a57a
          path: form-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          path: surface-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          path: capability-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: ddafc9e30144d12605c6e4198cd8d6c5764e6212
          path: interface-main
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 2bdf8eade1376055473b9cc1b11734b72a5566e5
          path: morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Independent Assembly 49 exact-fleet truth attack
        working-directory: verification
        env:
          R49_ASSEMBLY_BASE_COMMIT: a2fb0808e53a2a849b6746d5a4d2c1c296f2cfb0
          R49_ASSEMBLY49_ROOT: ${{ github.workspace }}/assembly49
          R49_ASSEMBLY49_COMMIT: d8f856e6cabb917ee8be4c84642121a023187422
          R49_FORM_MAIN_ROOT: ${{ github.workspace }}/form-main
          R49_SURFACE_MAIN_ROOT: ${{ github.workspace }}/surface-main
          R49_CAPABILITY_MAIN_ROOT: ${{ github.workspace }}/capability-main
          R49_INTERFACE_MAIN_ROOT: ${{ github.workspace }}/interface-main
          R49_MORPHTILE_ROOT: ${{ github.workspace }}/morphtile
        run: node --test test/round49-assembly49-current-fleet-refresh.test.js
      - name: Replay Assembly 49 producer suite
        working-directory: assembly49
        run: npm test
