name: round 63 Assembly58 current Interface fleet receiver

on:
  push:
    branches:
      - verification/round63-assembly58-current-interface-fleet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assembly58:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-assembly
          ref: d8f9f16242bd6960940dece550aa1d817db4756f
          fetch-depth: 0
          path: assembly58
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-form
          ref: ef6a09e4d662d960e015f61d7991c58d33f5c6d1
          path: form
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-surface
          ref: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          path: surface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-capability
          ref: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          path: capability
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile-machine-interface
          ref: 79739c5fae65a837e8c7a9f9a88fe76dfbab80ff
          fetch-depth: 0
          path: interface
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 685df074701feeae3e9d789e532d0a3658030bf4
          path: morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently verify current fleet receipt and receiver authority
        env:
          ASSEMBLY_ROOT: ${{ github.workspace }}/assembly58
          FORM_ROOT: ${{ github.workspace }}/form
          SURFACE_ROOT: ${{ github.workspace }}/surface
          CAPABILITY_ROOT: ${{ github.workspace }}/capability
          INTERFACE_ROOT: ${{ github.workspace }}/interface
          CORE_ROOT: ${{ github.workspace }}/morphtile
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const git = (root, args) => execFileSync('git', args, { cwd: root, encoding: 'utf8' }).trim();
          const roots = {
            assembly: process.env.ASSEMBLY_ROOT,
            form: process.env.FORM_ROOT,
            surface: process.env.SURFACE_ROOT,
            capability: process.env.CAPABILITY_ROOT,
            interface: process.env.INTERFACE_ROOT,
            core: process.env.CORE_ROOT
          };
          const expected = {
            assembly: 'd8f9f16242bd6960940dece550aa1d817db4756f',
            form: 'ef6a09e4d662d960e015f61d7991c58d33f5c6d1',
            surface: '4e4495182aa83e5dfba37722fc3756a70cfaafaa',
            capability: 'edc07af182ee26ca1ceb64b5d5205591ec6aca9d',
            interface: '79739c5fae65a837e8c7a9f9a88fe76dfbab80ff',
            core: '685df074701feeae3e9d789e532d0a3658030bf4'
          };
          for (const [lane, sha] of Object.entries(expected)) {
            assert.equal(git(roots[lane], ['rev-parse', 'HEAD']), sha, `${lane} checkout drifted`);
          }

          const base = 'a6dba7df09abdecbf33b982271f7da7ebdf82261';
          const changed = git(roots.assembly, ['diff', '--name-only', base, expected.assembly]).split('\n').filter(Boolean).sort();
          assert.deepEqual(changed, ['fixtures/current-fleet.json', 'test/current-interface-repeat-local-receiver.integration.test.js']);

          const receipt = JSON.parse(fs.readFileSync(path.join(roots.assembly, 'fixtures/current-fleet.json'), 'utf8'));
          assert.equal(receipt.schema, 'axm.morphtile.assembly-current-fleet/v1');
          assert.deepEqual(Object.keys(receipt).sort(), ['capability','core','form','interface','schema','surface']);
          for (const lane of ['form','surface','capability','interface','core']) assert.equal(receipt[lane], expected[lane]);
          const previous = JSON.parse(git(roots.assembly, ['show', `${base}:fixtures/current-fleet.json`]));
          assert.equal(previous.interface, '25dcb936e09bd440816d158b55151c879d5a558d');
          for (const lane of ['form','surface','capability','core']) assert.equal(receipt[lane], previous[lane], `${lane} moved unexpectedly`);

          const Capability = require(path.resolve(roots.capability, 'src'));
          const Interface = require(path.resolve(roots.interface, 'src'));
          const { run: assemble } = require(path.resolve(roots.assembly, 'src'));
          const { materializeKit } = require(path.resolve(roots.assembly, 'src/kit'));
          const MT = require(path.resolve(roots.core, 'core/morphtile.js'));
          const req = (request_id, goal, intent) => ({ envelope_version: '0.1', request_id, goal, intent, provenance: { caller: 'verification-round63' } });
          const id = 'mt_verify_repeat_readout_receiver';
          const ui = { candidate: { schema: 'morphtile.tile-spec/v0.4', id, name: 'Verification receiver', form_hints: ['ui_panel'], facets: {} }, provenance: { caller: 'verification-round63-base' } };
          const capability = Capability.run(req('cap', 'Provide one canonical count and increment authority', { kind: 'counter', initial: 3 }));
          const iface = Interface.run(req('iface', 'Repeat presentation over one canonical read and action authority', {
            tile_path: id,
            title: 'Verification receiver',
            elements: [{ kind: 'repeat', binding: 'count', step: 1, max: 4, children: [
              { kind: 'repeat_text', source: 'index', prefix: 'slot ' },
              { kind: 'readout', binding: 'count', repeat_label: { source: 'index', prefix: 'readout ' } },
              { kind: 'action', binding: 'increment', repeat_label: { source: 'index', prefix: 'increment ' } }
            ]}],
            bindings: { readouts: ['count'], actions: ['increment'], controls: [] }
          }));
          assert.equal(capability.status, 'CANDIDATE', JSON.stringify(capability.holds));
          assert.equal(iface.status, 'CANDIDATE', JSON.stringify(iface.holds));
          const out = assemble({ envelope_version: '0.1', request_id: 'assemble', goal: 'Portable receiver proof', intent: { id, name: 'Verification receiver' }, inputs: [ui, capability, iface], provenance: { caller: 'verification-round63' } });
          assert.equal(out.status, 'CANDIDATE', JSON.stringify(out.holds));
          assert.deepEqual(out.candidate.view, iface.candidate.operation.view);
          assert.equal(Object.keys(out.candidate.facets.logic.data.vars).filter(name => name === 'count').length, 1);
          assert.equal(out.candidate.facets.connect.sockets.filter(s => s.id === 'increment' && s.kind === 'signal' && s.dir === 'in').length, 1);

          const portable = materializeKit(out, MT, { name: 'Verification receiver kit' });
          assert.equal(portable.status, 'CANDIDATE', JSON.stringify(portable.holds));
          const receiver = MT.createWorld('Verification receiver world');
          const imported = MT.importKit(receiver, JSON.parse(JSON.stringify(portable.kit)));
          assert.equal(imported.status, 'READY', JSON.stringify(imported));
          for (const op of imported.ops || []) MT.applyStructOp(receiver, op);
          const received = MT.resolveTile(receiver, id);
          assert.ok(received);
          assert.deepEqual(received.view, out.candidate.view);
          assert.equal(Object.keys(received.facets.logic.data.vars).filter(name => name === 'count').length, 1);
          assert.equal(received.facets.connect.sockets.filter(s => s.id === 'increment' && s.kind === 'signal' && s.dir === 'in').length, 1);
          const before = MT.structHash(receiver);
          const html = MT.vnodeToHTML(MT.compilePanel(receiver).root);
          for (let i = 0; i < 3; i += 1) {
            assert.match(html, new RegExp(`slot ${i}`));
            assert.match(html, new RegExp(`readout ${i}`));
            assert.match(html, new RegExp(`increment ${i}`));
          }
          assert.equal((html.match(/readout [0-2]/g) || []).length, 3);
          assert.equal((html.match(new RegExp(`data-signal=\\"${id}:increment\\"`, 'g')) || []).length, 3);
          assert.equal(MT.structHash(receiver), before, 'rendering must remain structurally read-only');
          NODE
      - name: Replay Assembly58 producer suite against exact fleet
        working-directory: assembly58
        env:
          CURRENT_FORM_MACHINE_PATH: ${{ github.workspace }}/form/src
          CURRENT_FORM_COMMIT: ef6a09e4d662d960e015f61d7991c58d33f5c6d1
          CURRENT_SURFACE_MACHINE_PATH: ${{ github.workspace }}/surface/src
          CURRENT_SURFACE_COMMIT: 4e4495182aa83e5dfba37722fc3756a70cfaafaa
          CURRENT_CAPABILITY_MACHINE_PATH: ${{ github.workspace }}/capability/src
          CURRENT_CAPABILITY_COMMIT: edc07af182ee26ca1ceb64b5d5205591ec6aca9d
          CURRENT_INTERFACE_MACHINE_PATH: ${{ github.workspace }}/interface/src
          CURRENT_INTERFACE_COMMIT: 79739c5fae65a837e8c7a9f9a88fe76dfbab80ff
          CURRENT_MORPHTILE_CORE_PATH: ${{ github.workspace }}/morphtile/core/morphtile.js
          CURRENT_MORPHTILE_COMMIT: 685df074701feeae3e9d789e532d0a3658030bf4
        run: npm test
